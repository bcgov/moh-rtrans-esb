name: feature-build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      DEPLOY_TARGET:
        type: choice
        description: Environment to deploy the feature build to
        required: true
        options:
          - Silver Test
          - Gold
        default: Silver Test
      BRANCH_NAME:
        type: string
        description: Name of the feature branch
        required: true
        default: main

concurrency:
  group: feature-build-${{ inputs.DEPLOY_TARGET }}
  cancel-in-progress: false

env:
  GOLD_OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER_GOLD }}
  GOLD_DEFAULT_NAMESPACE: c8d6f2-tools
  GOLD_DEV_NAMESPACE: c8d6f2-dev
  GOLD_IMAGE_REGISTRY: image-registry.apps.gold.devops.gov.bc.ca
  GOLDDR_IMAGE_REGISTRY: image-registry.apps.golddr.devops.gov.bc.ca
  GOLD_OPENSHIFT_SA: ${{ secrets.C8D6F2_OPENSHIFT_GITHUB_ACTIONS_SA }}
  GOLD_OPENSHIFT_TOKEN: ${{ secrets.C8D6F2_OPENSHIFT_GITHUB_ACTIONS_SA_GOLD_TOKEN }}
  GOLDDR_OPENSHIFT_TOKEN: ${{ secrets.C8D6F2_OPENSHIFT_GITHUB_ACTIONS_SA_GOLDDR_TOKEN }}
  SILVER_OPENSHIFT_SERVER: ${{ secrets.C5839F_OPENSHIFT_SERVER }}
  SILVER_OPENSHIFT_TOKEN: ${{ secrets.C5839F_OPENSHIFT_GITHUB_ACTIONS_SA_TOKEN }}
  SILVER_DEFAULT_NAMESPACE: c5839f-tools
  SILVER_TEST_NAMESPACE: c5839f-test
  SILVER_IMAGE_REGISTRY: image-registry.apps.silver.devops.gov.bc.ca/c5839f-tools
  SILVER_IMAGE_REGISTRY_USER: ${{ secrets.C5839F_OPENSHIFT_GITHUB_ACTIONS_SA_USER }}
  IMAGE_NAME: rtrans-esb

jobs:
  createRtransFeatureBuild:
    runs-on: ubuntu-latest
    outputs:
      GOLD_IMAGE_SHA: ${{ steps.push-image-gold.outputs.digest }}
      SILVER_IMAGE_SHA: ${{ steps.push-image-silver.outputs.digest }}
      FEATURE_BUILD_NAME: ${{ steps.metadata.outputs.feature_build_name }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.BRANCH_NAME }}
          persist-credentials: false

      - name: Determine build name and tags
        id: metadata
        env:
          BRANCH_NAME: ${{ inputs.BRANCH_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse --verify HEAD)
          short_sha=${commit_sha:0:12}
          branch_slug=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          branch_slug=${branch_slug:0:60}
          branch_slug=${branch_slug%-}
          branch_slug=${branch_slug%.}
          if [[ -z "$branch_slug" ]]; then
            branch_slug=branch
          fi
          feature_build_name="featurebuild-${branch_slug}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "FEATURE_BUILD_NAME=$feature_build_name"
            echo "IMAGE_TAGS=$short_sha $feature_build_name"
            echo "SOURCE_SHA=$short_sha"
          } >> "$GITHUB_ENV"
          echo "feature_build_name=$feature_build_name" >> "$GITHUB_OUTPUT"

      - name: Maven build
        working-directory: ./rtrans-esb
        run: mvn --batch-mode install "-Dimpl-version=$FEATURE_BUILD_NAME" "-Dgit-commit=$SOURCE_SHA"

      - name: Build image
        id: build-docker
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}
          context: ./rtrans-esb
          containerfiles: ./rtrans-esb/Dockerfile

      - name: Push image to Gold registry
        id: push-image-gold
        if: inputs.DEPLOY_TARGET == 'Gold'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-docker.outputs.image }}
          tags: ${{ steps.build-docker.outputs.tags }}
          registry: ${{ env.GOLD_IMAGE_REGISTRY }}/${{ env.GOLD_DEFAULT_NAMESPACE }}
          username: ${{ env.GOLD_OPENSHIFT_SA }}
          password: ${{ env.GOLD_OPENSHIFT_TOKEN }}

      - name: Push image to Gold DR registry
        if: inputs.DEPLOY_TARGET == 'Gold'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-docker.outputs.image }}
          tags: ${{ steps.build-docker.outputs.tags }}
          registry: ${{ env.GOLDDR_IMAGE_REGISTRY }}/${{ env.GOLD_DEFAULT_NAMESPACE }}
          username: ${{ env.GOLD_OPENSHIFT_SA }}
          password: ${{ env.GOLDDR_OPENSHIFT_TOKEN }}

      - name: Push image to Silver registry
        id: push-image-silver
        if: inputs.DEPLOY_TARGET == 'Silver Test'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-docker.outputs.image }}
          tags: ${{ steps.build-docker.outputs.tags }}
          registry: ${{ env.SILVER_IMAGE_REGISTRY }}
          username: ${{ env.SILVER_IMAGE_REGISTRY_USER }}
          password: ${{ env.SILVER_OPENSHIFT_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: createRtransFeatureBuild

    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to Gold OpenShift
        if: inputs.DEPLOY_TARGET == 'Gold'
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.GOLD_OPENSHIFT_SERVER }}
          openshift_token: ${{ env.GOLD_OPENSHIFT_TOKEN }}
          namespace: ${{ env.GOLD_DEFAULT_NAMESPACE }}

      - name: Log in to Silver OpenShift
        if: inputs.DEPLOY_TARGET == 'Silver Test'
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.SILVER_OPENSHIFT_SERVER }}
          openshift_token: ${{ env.SILVER_OPENSHIFT_TOKEN }}
          namespace: ${{ env.SILVER_DEFAULT_NAMESPACE }}

      - name: Tag image in Gold dev namespace
        if: inputs.DEPLOY_TARGET == 'Gold'
        env:
          DIGEST: ${{ needs.createRtransFeatureBuild.outputs.GOLD_IMAGE_SHA }}
          BUILD_NAME: ${{ needs.createRtransFeatureBuild.outputs.FEATURE_BUILD_NAME }}
        run: |
          oc tag "${GOLD_DEFAULT_NAMESPACE}/${IMAGE_NAME}@${DIGEST}" "${GOLD_DEV_NAMESPACE}/${IMAGE_NAME}:${BUILD_NAME}"

      - name: Tag image in Silver Test namespace
        if: inputs.DEPLOY_TARGET == 'Silver Test'
        env:
          DIGEST: ${{ needs.createRtransFeatureBuild.outputs.SILVER_IMAGE_SHA }}
          BUILD_NAME: ${{ needs.createRtransFeatureBuild.outputs.FEATURE_BUILD_NAME }}
        run: |
          oc tag "${SILVER_DEFAULT_NAMESPACE}/${IMAGE_NAME}@${DIGEST}" "${SILVER_TEST_NAMESPACE}/${IMAGE_NAME}:${BUILD_NAME}"

      - name: Check out Gold manifest repo
        if: inputs.DEPLOY_TARGET == 'Gold'
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GITOPS_C8D6F2_PRIVATE_KEY }}
          repository: bcgov-c/tenant-gitops-c8d6f2
          ref: main
          path: gitops

      - name: Check out Silver manifest repo
        if: inputs.DEPLOY_TARGET == 'Silver Test'
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.GITOPS_C5839F_PRIVATE_KEY }}
          repository: bcgov-c/tenant-gitops-c5839f
          ref: main
          path: gitops

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'

      - name: Update Gold image and commit change
        if: inputs.DEPLOY_TARGET == 'Gold'
        working-directory: gitops
        env:
          DIGEST: ${{ needs.createRtransFeatureBuild.outputs.GOLD_IMAGE_SHA }}
          BUILD_NAME: ${{ needs.createRtransFeatureBuild.outputs.FEATURE_BUILD_NAME }}
        run: |
          set -euo pipefail
          cd rtrans-devops/overlay/dev
          kustomize edit set image "rtrans-image=${GOLD_IMAGE_REGISTRY}/${GOLD_DEV_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"
          cd ../../..
          git add -u -- rtrans-devops/overlay/dev
          if ! git diff --cached --quiet; then
            git config user.email 'action@github.com'
            git config user.name 'GitHub Action'
            git commit -m "Deploying feature build: ${BUILD_NAME} in Gold dev using feature-build workflow."
            git push origin HEAD:main
          fi

      - name: Update Silver Test image and commit change
        if: inputs.DEPLOY_TARGET == 'Silver Test'
        working-directory: gitops
        env:
          DIGEST: ${{ needs.createRtransFeatureBuild.outputs.SILVER_IMAGE_SHA }}
          BUILD_NAME: ${{ needs.createRtransFeatureBuild.outputs.FEATURE_BUILD_NAME }}
        run: |
          set -euo pipefail
          cd rtrans-devops/overlay/test
          kustomize edit set image "rtrans-image=image-registry.openshift-image-registry.svc:5000/${SILVER_TEST_NAMESPACE}/${IMAGE_NAME}@${DIGEST}"
          cd ../../..
          git add -u -- rtrans-devops/overlay/test
          if ! git diff --cached --quiet; then
            git config user.email 'action@github.com'
            git config user.name 'GitHub Action'
            git commit -m "Deploying feature build: ${BUILD_NAME} in Silver Test using feature-build workflow."
            git push origin HEAD:main
          fi
